# Alembic configuration for PQ-KMS.
#
# Migrations are normally applied automatically on server startup (see
# app/storage/migrate.py). This file exists so operators can also drive Alembic
# from the CLI for inspection or manual control, e.g.:
#
#   cd pqkms
#   PQKMS_DB_URL=postgresql+psycopg://... alembic current
#   PQKMS_DB_URL=postgresql+psycopg://... alembic history
#   PQKMS_DB_URL=postgresql+psycopg://... alembic upgrade head
#
# The database URL is resolved by env.py from PQKMS_DB_URL (falling back to the
# SQLite quickstart file), so it is intentionally left blank here.
[alembic]
script_location = app/storage/migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
