services:
  pqkms:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Pinned tag (not :latest) for reproducible deploys.
    image: pqkms:1.0.0
    container_name: pqkms
    # Run as the non-root user baked into the image (explicit for clarity).
    user: pqkms
    restart: unless-stopped
    environment:
      # PQKMS_PASSPHRASE is mandatory — the container fails fast if it's unset.
      # Load it from a secrets manager, HSM, or sealed vault — never bake it
      # into compose. Consider Shamir-sharing across operators.
      # Minimum length is enforced at startup (see PQKMS_MIN_PASSPHRASE_LEN).
      PQKMS_PASSPHRASE: "${PQKMS_PASSPHRASE:?PQKMS_PASSPHRASE must be set in .env or the environment}"
      PQKMS_DATA_DIR: /var/lib/pqkms
      # Optional: set to enforce a stricter minimum (default 16).
      # PQKMS_MIN_PASSPHRASE_LEN: "32"
      # Optional: cap request body size (bytes; default 16777216 = 16 MiB).
      # PQKMS_MAX_BODY_BYTES: "16777216"
    ports:
      # Bind to loopback only. The app serves plain HTTP unless PQKMS_TLS_* is
      # set, so it must sit behind a TLS-terminating reverse proxy rather than be
      # published to every host interface. Front it with a proxy (or publish a
      # TLS listener) for off-box access; see the HA topology in
      # docker-compose.ha.yml for the proxied pattern.
      - "127.0.0.1:8080:8080"
    volumes:
      - pqkms-data:/var/lib/pqkms
    # Cap memory/CPU so a runaway or hostile request load cannot exhaust the host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/\", timeout=2)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Read-only root filesystem; only the data volume and an ephemeral /tmp are
    # writable. Key material lives in the pqkms-data volume.
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pqkms-data:
    driver: local
