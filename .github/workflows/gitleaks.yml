name: Secret scan (gitleaks)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned gitleaks release and its published SHA-256 (verified before use).
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        # actions/checkout pinned by SHA. fetch-depth: 0 so gitleaks scans the
        # full commit history, not just the latest commit.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Run gitleaks (pinned binary — no third-party action, no secrets)
        run: |
          # Run the gitleaks binary directly rather than via the third-party
          # composite action, so no repository secret is ever handed to
          # third-party code. Scanning local git history needs no GITHUB_TOKEN.
          # The release tarball is checksum-verified before execution, and
          # .gitleaksignore (repo root) suppresses documented false positives.
          curl -sSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1
