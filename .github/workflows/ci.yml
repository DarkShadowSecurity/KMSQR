name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: CI only needs to read the repo.
permissions:
  contents: read

defaults:
  run:
    working-directory: pqkms

jobs:
  # Classical-path unit tests on Windows. liboqs-python is excluded on Windows
  # by the requirements marker, so this exercises the graceful classical-only
  # fallback (CLASSIC_X25519_AES256GCM / CLASSIC_ED25519).
  unit-classical:
    name: Unit tests (windows, classical-only)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v4.2.2 — pinned by SHA (Dependabot will bump this).
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        # actions/setup-python v5.3.0 — pinned by SHA.
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run unit tests
        run: python -m pytest tests/test_crypto.py tests/test_keystore.py tests/test_auth.py -v
      - name: Run e2e (classical fallback)
        env:
          PQKMS_REQUIRE_PQ: "0"
          PYTHONIOENCODING: utf-8
        run: python tests/e2e_integration.py

  # Full post-quantum path on Linux. Builds liboqs from source (matching
  # deploy/Dockerfile's pinned LIBOQS_REF) so the hybrid suites are exercised
  # and PQKMS_REQUIRE_PQ (default-on) is satisfied.
  pq:
    name: Unit + e2e (linux, post-quantum)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Must match the liboqs-python minor in requirements.txt (0.15.x).
      LIBOQS_REF: "0.15.0"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Build liboqs (ml_kem_768 + ml_dsa_65, user-local, no elevation)
        working-directory: ${{ runner.temp }}
        run: |
          # ubuntu-latest ships gcc/make/cmake/git preinstalled, so no apt-get
          # (and therefore no privilege elevation) is needed. Build with the
          # default Make generator (no ninja), without OpenSSL (liboqs has its
          # own AES/SHA), and install into a user-writable prefix exposed via
          # LD_LIBRARY_PATH — no system-wide install and no ldconfig.
          git clone --depth 1 --branch "$LIBOQS_REF" https://github.com/open-quantum-safe/liboqs.git
          cmake -S liboqs -B liboqs/build \
                -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
                -DBUILD_SHARED_LIBS=ON \
                -DOQS_BUILD_ONLY_LIB=ON \
                -DOQS_MINIMAL_BUILD="KEM_ml_kem_768;SIG_ml_dsa_65" \
                -DOQS_USE_OPENSSL=OFF
          cmake --build liboqs/build --parallel
          cmake --install liboqs/build
          echo "LD_LIBRARY_PATH=$HOME/.local/lib" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Verify liboqs is importable
        run: python -c "import oqs; print('liboqs OK')"
      - name: Run unit tests
        run: python -m pytest tests/test_crypto.py tests/test_keystore.py tests/test_auth.py -v
      - name: Run e2e (post-quantum active)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/e2e_integration.py
